name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: lowkey-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  lint:
    name: Format and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select stable Rust with lint components
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component rustfmt --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test release script
        shell: pwsh
        run: .\scripts\tests\release.Tests.ps1
      - name: Test CCADB scan script
        shell: pwsh
        run: .\scripts\tests\scan-ccadb.Tests.ps1

  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: target/release/lowkey-check
          - os: windows-latest
            binary: target\release\lowkey-check.exe
          - os: macos-latest
            binary: target/release/lowkey-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
      - name: Run unit and CLI integration tests
        run: cargo test --locked --release --all-targets
      - name: Build release binary
        run: cargo build --locked --release
      - name: Package binary and documentation
        shell: pwsh
        env:
          BINARY_PATH: ${{ matrix.binary }}
          ASSET_NAME: lowkey-check-${{ runner.os }}-${{ runner.arch }}.zip
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'lowkey-package'
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item -LiteralPath @($env:BINARY_PATH, 'README.md', 'LICENSE') -Destination $staging
          Compress-Archive -Path (Join-Path $staging '*') -DestinationPath $env:ASSET_NAME
      - name: Upload platform package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lowkey-check-${{ runner.os }}-${{ runner.arch }}
          path: lowkey-check-${{ runner.os }}-${{ runner.arch }}.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
