name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: lowkey-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Match tag to Cargo package version
        shell: bash
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Release tag must match Cargo.toml: expected v$version"
            exit 1
          fi

  checks:
    name: Build and validate release
    needs: version
    uses: $/.github/workflows/ci.yml

  publish:
    name: Publish release packages
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Required to create the release and upload its assets.
    steps:
      - name: Download validated platform packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lowkey-check-*
          path: release-assets
          merge-multiple: true
      - name: Generate checksums and create GitHub release
        shell: bash
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          packages=(lowkey-check-*.zip)
          if [[ "${#packages[@]}" -ne 3 ]]; then
            echo "::error::Expected all three validated platform packages"
            exit 1
          fi
          sha256sum "${packages[@]}" > SHA256SUMS
          args=(--verify-tag --generate-notes --title "$GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}" "${packages[@]}" SHA256SUMS
